<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b10" />
  <title>CinePay — Locadora Digital R$ 1,00</title>
  <style>
    :root {
      --bg: #090b10;
      --surface: #11151f;
      --surface-2: #181e2c;
      --surface-3: #20283b;
      --text: #f3f5f8;
      --muted: #98a2b3;
      --border: rgba(255, 255, 255, 0.09);
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --cyan: #06b6d4;
      --cyan-soft: rgba(6, 182, 212, 0.14);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.14);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.14);
      --radius: 16px;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top right, rgba(239, 68, 68, 0.08), transparent 45%),
                  radial-gradient(circle at top left, rgba(6, 182, 212, 0.07), transparent 40%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 56px;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .container {
      width: 100%;
      max-width: 1220px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(9, 11, 16, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.05rem;
      color: #fff;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-sub {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .status-pill {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-weight: 600;
    }

    .status-pill.offline {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: transform 0.14s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-ghost {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-ghost:hover {
      background: var(--surface-3);
    }

    .btn-ghost.active {
      border-color: var(--cyan);
      background: var(--cyan-soft);
      color: #e0f7ff;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-cyan {
      background: var(--cyan);
      color: #041016;
      font-weight: 700;
    }

    .btn-green {
      background: var(--green);
      color: #04150e;
      font-weight: 700;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    .badge-count {
      background: rgba(255, 255, 255, 0.16);
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 0.74rem;
    }

    /* Hero / Controls */
    .hero {
      margin: 20px 0 18px;
      padding: 18px;
      border-radius: var(--radius);
      background: linear-gradient(125deg, rgba(239, 68, 68, 0.12), rgba(17, 21, 31, 0.95) 45%, rgba(6, 182, 212, 0.1));
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero h1 {
      font-size: clamp(1.35rem, 3vw, 1.9rem);
      font-weight: 800;
      line-height: 1.2;
    }

    .hero p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .pix-highlight {
      background: var(--surface-2);
      border: 1px solid rgba(6, 182, 212, 0.35);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
    }

    .pix-highlight strong {
      color: var(--cyan);
    }

    .filters-bar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
    }

    @media (max-width: 720px) {
      .filters-bar {
        grid-template-columns: 1fr;
      }
    }

    .input, .select, .textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      outline: none;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--cyan);
    }

    .genres-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      white-space: nowrap;
      color: var(--muted);
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* Continue Watching */
    .continue-box {
      margin-bottom: 22px;
      padding: 14px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 1.12rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Movies Grid */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 16px;
    }

    @media (max-width: 480px) {
      .movies-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
    }

    .movie-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }

    .movie-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .poster-wrap {
      position: relative;
      aspect-ratio: 2 / 3;
      background: var(--surface-2);
      overflow: hidden;
      cursor: pointer;
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster-top {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .tag-price {
      background: rgba(9, 11, 16, 0.85);
      border: 1px solid rgba(6, 182, 212, 0.45);
      color: var(--cyan);
    }

    .tag-unlocked {
      background: rgba(16, 185, 129, 0.9);
      color: #03150d;
    }

    .fav-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(9, 11, 16, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
      display: grid;
      place-items: center;
      font-size: 0.95rem;
    }

    .fav-btn.active {
      color: #fb7185;
      border-color: #fb7185;
    }

    .movie-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .movie-title {
      font-weight: 700;
      font-size: 0.96rem;
      line-height: 1.3;
      cursor: pointer;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .movie-sinopse {
      font-size: 0.8rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .progress-bar {
      height: 5px;
      background: var(--surface-3);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar > span {
      display: block;
      height: 100%;
      background: var(--cyan);
    }

    .movie-actions {
      margin-top: auto;
      display: flex;
      gap: 6px;
      padding-top: 6px;
    }

    /* Admin Panel */
    .admin-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin: 16px 0 22px;
    }

    .stat-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 4px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 20px;
    }

    @media (max-width: 880px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 600;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
    }

    .modal.modal-lg {
      max-width: 820px;
    }

    .modal-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .modal-body {
      padding: 18px;
      overflow-y: auto;
    }

    .pix-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-top: 12px;
    }

    .pix-code-box {
      background: var(--bg);
      border: 1px dashed rgba(6, 182, 212, 0.5);
      border-radius: 10px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.76rem;
      word-break: break-all;
      color: #cffafe;
      margin: 10px 0;
      text-align: left;
    }

    .player-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .player-frame iframe,
    .player-frame video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .demo-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: radial-gradient(circle at center, rgba(239, 68, 68, 0.25), #05070c 75%);
    }

    .review-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 0.84rem;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 90;
      background: var(--surface-3);
      border: 1px solid var(--cyan);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <button class="brand" onclick="setView('catalog')">
        <div class="brand-logo">CP</div>
        <div>
          <div class="brand-title">
            CINEPAY
            <span class="status-pill" id="netStatus">Online</span>
          </div>
          <div class="brand-sub">Filmes por R$ 1,00 • Pix CPF 058.504.666-22</div>
        </div>
      </button>

      <nav class="nav-actions">
        <button class="btn btn-ghost btn-sm active" id="navCatalog" onclick="setView('catalog')">
          Catálogo
        </button>
        <button class="btn btn-ghost btn-sm" id="navMine" onclick="setView('mine')">
          Meus Filmes <span class="badge-count" id="mineCount">0</span>
        </button>
        <button class="btn btn-ghost btn-sm" id="navFavs" onclick="setView('favorites')">
          Favoritos <span class="badge-count" id="favCount">0</span>
        </button>
        <button class="btn btn-primary btn-sm" id="navAdmin" onclick="openAdminGate()">
          Painel Admin
        </button>
      </nav>
    </div>
  </header>

  <main class="container" id="appView">
    <!-- Conteúdo renderizado via JS -->
  </main>

  <!-- Modal Detalhes & Avaliações -->
  <div class="modal-backdrop" id="detailsModal">
    <div class="modal modal-lg">
      <div class="modal-head">
        <h3 id="detailsTitle">Detalhes do Filme</h3>
        <button class="btn btn-ghost btn-sm" onclick="closeModal('detailsModal')">✕</button>
      </div>
      <div class="modal-body" id="detailsBody"></div>
    </div>
  </div>

  <!-- Modal Checkout Pix R$ 1,00 -->
  <div class="modal-backdrop" id="checkoutModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Pagamento via Pix — R$ 1,00</h3>
        <button class="btn btn-ghost btn-sm" onclick="closeModal('checkoutModal')">✕</button>
      </div>
      <div class="modal-body" id="checkoutBody"></div>
    </div>
  </div>

  <!-- Modal Player de Vídeo -->
  <div class="modal-backdrop" id="playerModal">
    <div class="modal modal-lg">
      <div class="modal-head">
        <h3 id="playerTitle">Reproduzindo Filme</h3>
        <button class="btn btn-ghost btn-sm" onclick="closePlayer()">✕</button>
      </div>
      <div class="modal-body" id="playerBody"></div>
    </div>
  </div>

  <!-- Modal Senha Admin -->
  <div class="modal-backdrop" id="adminPassModal">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-head">
        <h3>Acesso ao Painel Admin</h3>
        <button class="btn btn-ghost btn-sm" onclick="closeModal('adminPassModal')">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.86rem; color: var(--muted); margin-bottom: 12px;">
          Digite a senha administrativa para cadastrar filmes, importar/exportar JSON e ver vendas. (Padrão: <strong>1234</strong>)
        </p>
        <input type="password" id="adminPassInput" class="input" placeholder="Digite a senha..." onkeydown="if(event.key==='Enter') verifyAdminPass()" />
        <button class="btn btn-primary" style="width: 100%; margin-top: 12px;" onclick="verifyAdminPass()">
          Entrar no Painel
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>

    const PIX_KEY_FORMATTED = "058.504.666-22";

    let state = {
      view: "catalog", // catalog | mine | favorites | admin
      search: "",
      genre: "Todos",
      sort: "featured",
      movies: [],

      favorites: [],

    function loadState() {
      try {
        const rawMovies = localStorage.getItem(STORAGE_KEYS.movies);
        state.movies = rawMovies ? JSON.parse(rawMovies) : [...SAMPLE_MOVIES];
        if (!Array.isArray(state.movies)) state.movies = [...SAMPLE_MOVIES];

        state.unlocked = JSON.parse(localStorage.getItem(STORAGE_KEYS.unlocked) || "[]");
        state.favorites = JSON.parse(localStorage.getItem(STORAGE_KEYS.favorites) || "[]");
        state.sales = JSON.parse(localStorage.getItem(STORAGE_KEYS.sales) || "[]");
        state.progress = JSON.parse(localStorage.getItem(STORAGE_KEYS.progress) || "{}");
        state.reviews = JSON.parse(localStorage.getItem(STORAGE_KEYS.reviews) || "{}");
        if (!localStorage.getItem(STORAGE_KEYS.adminPass)) {
          localStorage.setItem(STORAGE_KEYS.adminPass, ADMIN_PASS_DEFAULT);
        }
      } catch (e) {
        state.movies = [...SAMPLE_MOVIES];
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEYS.movies, JSON.stringify(state.movies));
      localStorage.setItem(STORAGE_KEYS.unlocked, JSON.stringify(state.unlocked));
      localStorage.setItem(STORAGE_KEYS.favorites, JSON.stringify(state.favorites));
      localStorage.setItem(STORAGE_KEYS.sales, JSON.stringify(state.sales));
      localStorage.setItem(STORAGE_KEYS.progress, JSON.stringify(state.progress));
      localStorage.setItem(STORAGE_KEYS.reviews, JSON.stringify(state.reviews));
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2800);
    }

    function formatBRL(val) {
      return Number(val || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function generatePosterDataUrl(title, genre, year) {
      const canvas = document.createElement("canvas");
      canvas.width = 400;
      canvas.height = 600;
      const ctx = canvas.getContext("2d");

      const palettes = [
        ["#1e1b4b", "#0f172a", "#ef4444"],
        ["#082f49", "#090d16", "#06b6d4"],
        ["#3b0764", "#09090b", "#f59e0b"],
        ["#064e3b", "#060b09", "#10b981"]
      ];
      const idx = Math.abs(String(title).split("").reduce((a, c) => a + c.charCodeAt(0), 0)) % palettes.length;
      const [c1, c2, acc] = palettes[idx];

      const grad = ctx.createLinearGradient(0, 0, 400, 600);
      grad.addColorStop(0, c1);
      grad.addColorStop(1, c2);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 400, 600);

      ctx.strokeStyle = acc;
      ctx.lineWidth = 4;
      ctx.strokeRect(18, 18, 364, 564);

      ctx.fillStyle = acc;
      ctx.font = "bold 18px system-ui, sans-serif";
      ctx.fillText(`CINEPAY • R$ 1,00`, 36, 62);

      ctx.fillStyle = "#cbd5e1";
      ctx.font = "600 15px system-ui, sans-serif";
      ctx.fillText(`${genre || "Filme"} • ${year || "2026"}`, 36, 92);

      ctx.fillStyle = "#ffffff";
      ctx.font = "800 32px system-ui, sans-serif";
      const words = String(title || "Filme").split(" ");
      let line = "";
      let y = 250;
      for (const w of words) {
        const test = line ? `${line} ${w}` : w;
        if (ctx.measureText(test).width > 328 && line) {
          ctx.fillText(line, 36, y);
          line = w;
          y += 40;
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, 36, y);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "500 15px system-ui, sans-serif";
      ctx.fillText("Toque para assistir • Pix CPF 058.504.666-22", 36, 542);

      return canvas.toDataURL("image/jpeg", 0.85);
    }

    function getPoster(movie) {
      if (movie.poster && (movie.poster.startsWith("http") || movie.poster.startsWith("data:image"))) {
        return movie.poster;
      }
      return generatePosterDataUrl(movie.title, movie.genre, movie.year);
    }

    function normalizeMovie(raw, idx = 0) {
      const priceNum = Number(raw.price);
      return {
        id: String(raw.id || `m-${Date.now()}-${idx}`),
        title: String(raw.title || raw.titulo || "Filme sem título").trim(),
        year: Number(raw.year || raw.ano || 2026) || 2026,
        genre: String(raw.genre || raw.genero || "Geral").trim(),
        duration: String(raw.duration || raw.duracao || "1h 40m").trim(),
        price: Number.isFinite(priceNum) && priceNum >= 0 ? Number(priceNum.toFixed(2)) : DEFAULT_PRICE,
        synopsis: String(raw.synopsis || raw.sinopse || "Filme disponível no catálogo CinePay.").trim(),
        poster: String(raw.poster || raw.capa || "").trim(),
        videoUrl: String(raw.videoUrl || raw.url || raw.video || "").trim(),
        trailerUrl: String(raw.trailerUrl || raw.trailer || "").trim()
      };
    }

    /* EMV Pix BR Code Generator + CRC16-CCITT */
    function crc16Ccitt(str) {
      let crc = 0xFFFF;
      for (let i = 0; i < str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for (let b = 0; b < 8; b++) {
          if (crc & 0x8000) {
            crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
          } else {
            crc = (crc << 1) & 0xFFFF;
          }
        }
      }
      return crc.toString(16).toUpperCase().padStart(4, "0");
    }

    function emvField(id, value) {
      const val = String(value);
      const len = String(val.length).padStart(2, "0");
      return `${id}${len}${val}`;
    }

    function buildPixPayload(amount, txidLabel = "CINEPAY") {
      const cleanKey = PIX_KEY_RAW.replace(/\D/g, "");
      const gui = emvField("00", "br.gov.bcb.pix");
      const keyField = emvField("01", cleanKey);
      const merchantAccountInfo = emvField("26", `${gui}${keyField}`);

      const mcc = emvField("52", "0000");
      const currency = emvField("53", "986");
      const amountStr = Number(amount || DEFAULT_PRICE).toFixed(2);
      const amountField = emvField("54", amountStr);
      const country = emvField("58", "BR");
      const name = emvField("59", PIX_MERCHANT_NAME.slice(0, 25));
      const city = emvField("60", PIX_MERCHANT_CITY.slice(0, 15));

      const cleanTxid = String(txidLabel || "CINEPAY").replace(/[^A-Za-z0-9]/g, "").slice(0, 20) || "CINEPAY";
      const addDataField = emvField("62", emvField("05", cleanTxid));

      const payloadWithoutCrc = `000201${merchantAccountInfo}${mcc}${currency}${amountField}${country}${name}${city}${addDataField}6304`;
      const crc = crc16Ccitt(payloadWithoutCrc);
      return `${payloadWithoutCrc}${crc}`;
    }

    function drawQrMatrixOnCanvas(canvas, text) {
      const ctx = canvas.getContext("2d");
      const size = canvas.width;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);

      const cells = 29;
      const margin = 16;
      const cellSize = Math.floor((size - margin * 2) / cells);
      const offset = Math.floor((size - cellSize * cells) / 2);

      const matrix = Array.from({ length: cells }, () => Array(cells).fill(false));

      function drawFinder(r0, c0) {
        for (let r = -1; r <= 7; r++) {
          for (let c = -1; c <= 7; c++) {
            const rr = r0 + r;
            const cc = c0 + c;
            if (rr < 0 || rr >= cells || cc < 0 || cc >= cells) continue;
            const onBorder = r === 0 || r === 6 || c === 0 || c === 6;
            const onCenter = r >= 2 && r <= 4 && c >= 2 && c <= 4;
            matrix[rr][cc] = onBorder || onCenter;
          }
        }
      }

      drawFinder(0, 0);
      drawFinder(0, cells - 7);
      drawFinder(cells - 7, 0);

      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      for (let r = 0; r < cells; r++) {
        for (let c = 0; c < cells; c++) {
          const inFinderA = r < 8 && c < 8;
          const inFinderB = r < 8 && c >= cells - 8;
          const inFinderC = r >= cells - 8 && c < 8;
          if (inFinderA || inFinderB || inFinderC) continue;
          hash ^= (r * 31 + c * 17 + iMix(r, c, hash));
          hash = Math.imul(hash, 16777619);
          matrix[r][c] = ((hash >>> 0) % 100) < 46;
        }
      }

      function iMix(a, b, h) {
        return ((a * b + (h & 255)) & 255);
      }

      ctx.fillStyle = "#090b10";
      for (let r = 0; r < cells; r++) {
        for (let c = 0; c < cells; c++) {
          if (matrix[r][c]) {
            ctx.fillRect(offset + c * cellSize, offset + r * cellSize, cellSize, cellSize);
          }
        }
      }
    }

    function updateBadges() {
      document.getElementById("mineCount").textContent = state.unlocked.length;
      document.getElementById("favCount").textContent = state.favorites.length;
      ["navCatalog", "navMine", "navFavs", "navAdmin"].forEach(id => {
        document.getElementById(id)?.classList.remove("active");
      });
      if (state.view === "catalog") document.getElementById("navCatalog")?.classList.add("active");
      if (state.view === "mine") document.getElementById("navMine")?.classList.add("active");
      if (state.view === "favorites") document.getElementById("navFavs")?.classList.add("active");
      if (state.view === "admin") document.getElementById("navAdmin")?.classList.add("active");
    }

    function setView(v) {
      state.view = v;
      render();
    }

    function toggleFavorite(id, ev) {
      if (ev) ev.stopPropagation();
      const idx = state.favorites.indexOf(id);
      if (idx >= 0) {
        state.favorites.splice(idx, 1);
        showToast("Removido dos favoritos");
      } else {
        state.favorites.push(id);
        showToast("Adicionado aos favoritos");
      }
      saveState();
      render();
    }

    function getFilteredMovies() {
      let list = [...state.movies];
      if (state.view === "mine") {
        list = list.filter(m => state.unlocked.includes(m.id));
      } else if (state.view === "favorites") {
        list = list.filter(m => state.favorites.includes(m.id));
      }

      if (state.genre && state.genre !== "Todos") {
        list = list.filter(m => m.genre.toLowerCase() === state.genre.toLowerCase());
      }

      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        list = list.filter(m =>
          m.title.toLowerCase().includes(q) ||
          m.synopsis.toLowerCase().includes(q) ||
          m.genre.toLowerCase().includes(q) ||
          String(m.year).includes(q)
        );
      }

      if (state.sort === "price_asc") {
        list.sort((a, b) => a.price - b.price);
      } else if (state.sort === "year_desc") {
        list.sort((a, b) => b.year - a.year);
      } else if (state.sort === "title_asc") {
        list.sort((a, b) => a.title.localeCompare(b.title, "pt-BR"));
      }
      return list;
    }

    function renderMovieCard(m) {
      const isUnlocked = state.unlocked.includes(m.id);
      const isFav = state.favorites.includes(m.id);
      const prog = state.progress[m.id] || 0;
      const poster = getPoster(m);

      return `
        <article class="movie-card">
          <div class="poster-wrap" onclick="openDetails('${m.id}')">
            <img src="${poster}" alt="${escapeHtml(m.title)}" loading="lazy" />
            <div class="poster-top">
              ${
                isUnlocked
                  ? `<span class="tag tag-unlocked">Liberado</span>`
                  : `<span class="tag tag-price">${formatBRL(m.price)}</span>`
              }
              <button class="fav-btn ${isFav ? "active" : ""}" title="Favoritar" onclick="toggleFavorite('${m.id}', event)">
                ${isFav ? "♥" : "♡"}
              </button>
            </div>
          </div>
          <div class="movie-body">
            <div class="movie-title" onclick="openDetails('${m.id}')">${escapeHtml(m.title)}</div>
            <div class="movie-meta">
              <span>${escapeHtml(m.genre)}</span>
              <span>${m.year} • ${escapeHtml(m.duration)}</span>
            </div>
            <p class="movie-sinopse">${escapeHtml(m.synopsis)}</p>
            ${
              prog > 0
                ? `<div class="progress-bar" title="Progresso: ${prog}%"><span style="width:${Math.min(100, prog)}%"></span></div>`
                : ""
            }
            <div class="movie-actions">
              ${
                isUnlocked
                  ? `<button class="btn btn-green btn-sm" style="flex:1" onclick="openPlayer('${m.id}')">▶ Assistir</button>`
                  : `<button class="btn btn-cyan btn-sm" style="flex:1" onclick="openCheckout('${m.id}')">Pix ${formatBRL(m.price)}</button>`
              }
              <button class="btn btn-ghost btn-sm" onclick="openDetails('${m.id}')">Detalhes</button>
            </div>
          </div>
        </article>
      `;
    }

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                  ${continueMovies
                    .map(
                      m => `

                    .join("")}

            `
            : ""
        }

        <div id="catalogDynamic">

            <div class="section-title">${headingLabel} <span style="color:var(--muted); font-size:0.88rem; font-weight:500;">(${filtered.length})</span></div>
          </div>

          ${
            filtered.length === 0
              ? `
                <div class="empty-state">
                  <p style="margin-bottom:12px;">Nenhum filme encontrado para este filtro.</p>
                  ${
                    state.movies.length === 0
                      ? `<button class="btn btn-cyan btn-sm" onclick="restoreSampleMovies()">Carregar Filmes de Exemplo</button>`
                      : `<button class="btn btn-ghost btn-sm" onclick="state.search=''; state.genre='Todos'; state.view='catalog'; render();">Limpar filtros</button>`
                  }
                </div>
              `
              : `<div class="movies-grid">${filtered.map(renderMovieCard).join("")}</div>`
          }
        </div>
      `;
    }

      const filtered = getFilteredMovies();

        state.view === "mine"
          ? "Meus Filmes Liberados"
          : state.view === "favorites"
          ? "Minha Lista de Desejos"
          : "Catálogo de Filmes";

      container.innerHTML = `
        <div class="section-header">
          <div class="section-title">${headingLabel} <span style="color:var(--muted); font-size:0.88rem; font-weight:500;">(${filtered.length})</span></div>
        </div>
        ${
          filtered.length === 0
            ? `<div class="empty-state"><p>Nenhum filme encontrado.</p></div>`
            : `<div class="movies-grid">${filtered.map(renderMovieCard).join("")}</div>`
        }
      `;
    }

                        ? `<tr><td colspan="4" style="text-align:center; color:var(--muted);">Nenhum filme cadastrado.</td></tr>`
                        : state.movies
                            .map(
                              m => `
                                <tr>
                                  <td><strong>${escapeHtml(m.title)}</strong> <span style="color:var(--muted);">(${m.year})</span></td>
                                  <td>${escapeHtml(m.genre)}</td>
                                  <td>${formatBRL(m.price)}</td>
                                  <td style="white-space:nowrap;">
                                    <button class="btn btn-ghost btn-sm" onclick="startEditMovie('${m.id}')">Editar</button>
                                    <button class="btn btn-primary btn-sm" onclick="deleteMovie('${m.id}')">Excluir</button>
                                  </td>
                                </tr>

                            .join("")
                    }
                  </tbody>
                </table>
              </div>

              <h3 style="margin-bottom:10px; font-size:1.05rem;">Histórico de Vendas (${state.sales.length})</h3>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Data/Hora</th>
                      <th>Filme</th>
                      <th>Pix CPF</th>
                      <th>Valor</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${
                      state.sales.length === 0
                        ? `<tr><td colspan="4" style="text-align:center; color:var(--muted);">Nenhuma venda registrada ainda.</td></tr>`
                        : [...state.sales]
                            .reverse()
                            .slice(0, 15)
                            .map(
                              s => `
                                <tr>
                                  <td>${escapeHtml(s.date)}</td>
                                  <td>${escapeHtml(s.movieTitle)}</td>
                                  <td>${PIX_KEY_FORMATTED}</td>
                                  <td style="color:var(--green); font-weight:700;">${formatBRL(s.amount)}</td>
                                </tr>
                              `
                            )
                            .join("")
                    }
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function render() {
      updateBadges();
      const viewEl = document.getElementById("appView");
      if (state.view === "admin") {
        viewEl.innerHTML = renderAdminView();
      } else {
        viewEl.innerHTML = renderCatalogView();
      }
    }

    /* Admin Actions */
    function openAdminGate() {
      if (state.view === "admin") {
        setView("catalog");
        return;
      }
      document.getElementById("adminPassInput").value = "";
      document.getElementById("adminPassModal").classList.add("open");
      setTimeout(() => document.getElementById("adminPassInput").focus(), 80);
    }

    function verifyAdminPass() {
      const typed = document.getElementById("adminPassInput").value;
      const savedPass = localStorage.getItem(STORAGE_KEYS.adminPass) || ADMIN_PASS_DEFAULT;
      if (typed === savedPass || typed === ADMIN_PASS_DEFAULT) {
        closeModal("adminPassModal");
        state.view = "admin";
        render();
        showToast("Painel Administrativo aberto");
      } else {
        showToast("Senha incorreta (padrão: 1234)");
      }
    }

    let uploadedPosterBase64 = "";

    function handlePosterUpload(ev) {
      const file = ev.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const maxW = 500;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          uploadedPosterBase64 = canvas.toDataURL("image/jpeg", 0.82);
          showToast("Capa carregada e otimizada");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveMovieForm(ev) {
      ev.preventDefault();
      const title = document.getElementById("fTitle").value.trim();
      if (!title) return;

      const genre = document.getElementById("fGenre").value.trim() || "Geral";
      const year = Number(document.getElementById("fYear").value) || 2026;
      const duration = document.getElementById("fDuration").value.trim() || "1h 40m";
      const priceVal = Number(document.getElementById("fPrice").value);
      const price = Number.isFinite(priceVal) && priceVal >= 0 ? Number(priceVal.toFixed(2)) : DEFAULT_PRICE;
      const videoUrl = document.getElementById("fVideo").value.trim();
      const posterInputUrl = document.getElementById("fPoster").value.trim();
      const synopsis = document.getElementById("fSynopsis").value.trim() || "Filme disponível na plataforma CinePay.";

      if (state.editingMovieId) {
        const idx = state.movies.findIndex(m => m.id === state.editingMovieId);
        if (idx >= 0) {
          const existingPoster = state.movies[idx].poster;
          state.movies[idx] = {
            ...state.movies[idx],
            title,
            genre,
            year,
            duration,
            price,
            videoUrl,
            synopsis,
            poster: uploadedPosterBase64 || posterInputUrl || existingPoster || ""
          };
        }
        state.editingMovieId = null;
        showToast("Filme atualizado com sucesso!");
      } else {
        state.movies.unshift({
          id: `m-${Date.now()}`,
          title,
          genre,
          year,
          duration,
          price,
          videoUrl,
          synopsis,
          poster: uploadedPosterBase64 || posterInputUrl || "",
          trailerUrl: ""
        });
        showToast("Novo filme adicionado ao catálogo!");
      }

      uploadedPosterBase64 = "";
      saveState();
      render();
    }

    function startEditMovie(id) {
      uploadedPosterBase64 = "";
      state.editingMovieId = id;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function deleteMovie(id) {
      state.movies = state.movies.filter(m => m.id !== id);
      if (state.editingMovieId === id) state.editingMovieId = null;
      saveState();
      render();
      showToast("Filme removido");
    }

    function applyPriceToAll(newPrice) {
      state.movies = state.movies.map(m => ({ ...m, price: Number(newPrice.toFixed(2)) }));
      saveState();
      render();
      showToast(`Todos os filmes agora custam ${formatBRL(newPrice)}`);
    }

    function restoreSampleMovies() {
      state.movies = [...SAMPLE_MOVIES];
      saveState();
      render();
      showToast("Filmes de exemplo carregados!");
    }

    /* Export / Import JSON */
    function exportJsonData() {
      const payload = {
        app: "CinePay",
        pixCpf: PIX_KEY_RAW,
        exportedAt: new Date().toISOString(),
        movies: state.movies,
        unlocked: state.unlocked,
        favorites: state.favorites,
        sales: state.sales,
        progress: state.progress,
        reviews: state.reviews
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `cinepay-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Backup JSON exportado!");
    }

    function handleImportJson(ev) {
      const file = ev.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const parsed = JSON.parse(e.target.result);
          let incomingMovies = [];

          if (Array.isArray(parsed)) {
            incomingMovies = parsed.map((item, i) => normalizeMovie(item, i));
          } else if (parsed && typeof parsed === "object") {
            if (Array.isArray(parsed.movies)) {
              incomingMovies = parsed.movies.map((item, i) => normalizeMovie(item, i));
            }
            if (Array.isArray(parsed.unlocked)) state.unlocked = parsed.unlocked.map(String);
            if (Array.isArray(parsed.favorites)) state.favorites = parsed.favorites.map(String);
            if (Array.isArray(parsed.sales)) state.sales = parsed.sales;
            if (parsed.progress && typeof parsed.progress === "object") state.progress = parsed.progress;
            if (parsed.reviews && typeof parsed.reviews === "object") state.reviews = parsed.reviews;
          }

          if (incomingMovies.length === 0 && !parsed.movies) {
            showToast("JSON válido, mas nenhum filme encontrado");
            return;
          }

          const mergeMode = confirm(
            `Encontrados ${incomingMovies.length} filme(s) no JSON.\n\nClique em OK para MESCLAR com o catálogo atual ou CANCELAR para SUBSTITUIR o catálogo.`
          );

          if (mergeMode) {
            const map = new Map(state.movies.map(m => [m.id, m]));
            for (const m of incomingMovies) {
              map.set(m.id, m);
            }
            state.movies = Array.from(map.values());
          } else {
            state.movies = incomingMovies;
          }

          saveState();
          render();
          showToast(`JSON importado com sucesso (${state.movies.length} filmes)!`);
        } catch (err) {
          showToast("Erro ao ler o arquivo JSON. Verifique o formato.");
        } finally {
          ev.target.value = "";
        }
      };
      reader.readAsText(file);
    }

    function copyFullPageHtml() {
      const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      navigator.clipboard?.writeText(html).then(
        () => showToast("Código HTML completo copiado!"),
        () => showToast("Não foi possível copiar automaticamente neste navegador.")
      );
    }

    /* Details & Reviews */
    function openDetails(movieId) {
      const m = state.movies.find(item => item.id === movieId);
      if (!m) return;
      const isUnlocked = state.unlocked.includes(m.id);
      const isFav = state.favorites.includes(m.id);
      const movieReviews = state.reviews[m.id] || [];

      document.getElementById("detailsTitle").textContent = m.title;
      document.getElementById("detailsBody").innerHTML = `
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:16px;">
          <div>
            <img src="${getPoster(m)}" alt="${escapeHtml(m.title)}" style="width:100%; border-radius:12px; display:block;" />
          </div>
          <div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
              <span class="tag tag-price">${escapeHtml(m.genre)}</span>
              <span class="tag tag-price">${m.year}</span>
              <span class="tag tag-price">${escapeHtml(m.duration)}</span>
              <span class="tag ${isUnlocked ? "tag-unlocked" : "tag-price"}">${isUnlocked ? "Liberado" : formatBRL(m.price)}</span>
            </div>
            <p style="color:var(--muted); font-size:0.9rem; margin-bottom:16px;">${escapeHtml(m.synopsis)}</p>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;">
              ${
                isUnlocked
                  ? `<button class="btn btn-green" onclick="closeModal('detailsModal'); openPlayer('${m.id}');">▶ Assistir Agora</button>`
                  : `<button class="btn btn-cyan" onclick="closeModal('detailsModal'); openCheckout('${m.id}');">Pagar ${formatBRL(m.price)} via Pix CPF</button>`
              }
              <button class="btn btn-ghost" onclick="toggleFavorite('${m.id}'); openDetails('${m.id}');">
                ${isFav ? "♥ Favoritado" : "♡ Favoritar"}
              </button>
            </div>

            <h4 style="font-size:0.95rem; margin-bottom:8px;">Avaliações (${movieReviews.length})</h4>
            <div style="margin-bottom:12px;">
              ${
                movieReviews.length === 0
                  ? `<p style="font-size:0.82rem; color:var(--muted);">Seja o primeiro a avaliar este filme.</p>`
                  : movieReviews
                      .map(
                        r => `
                          <div class="review-item">
                            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                              <strong>${escapeHtml(r.author || "Espectador")}</strong>
                              <span style="color:var(--amber);">★ ${r.rating}/5</span>
                            </div>
                            <div style="color:var(--muted);">${escapeHtml(r.comment)}</div>
                          </div>
                        `
                      )
                      .join("")
              }
            </div>

            <form onsubmit="addReview(event, '${m.id}')">
              <div class="form-row" style="margin-bottom:8px;">
                <input type="text" id="revAuthor" class="input" placeholder="Seu nome (opcional)" />
                <select id="revRating" class="select">
                  <option value="5">★★★★★ (5/5)</option>
                  <option value="4">★★★★☆ (4/5)</option>
                  <option value="3">★★★☆☆ (3/5)</option>
                  <option value="2">★★☆☆☆ (2/5)</option>
                  <option value="1">★☆☆☆☆ (1/5)</option>
                </select>
              </div>
              <input type="text" id="revComment" class="input" required placeholder="Escreva um comentário..." style="margin-bottom:8px;" />
              <button type="submit" class="btn btn-ghost btn-sm">Enviar Avaliação</button>
            </form>
          </div>
        </div>
      `;
      document.getElementById("detailsModal").classList.add("open");
    }

    function addReview(ev, movieId) {
      ev.preventDefault();
      const author = document.getElementById("revAuthor").value.trim() || "Cliente CinePay";
      const rating = Number(document.getElementById("revRating").value) || 5;
      const comment = document.getElementById("revComment").value.trim();
      if (!comment) return;

      if (!state.reviews[movieId]) state.reviews[movieId] = [];
      state.reviews[movieId].unshift({ author, rating, comment, date: new Date().toLocaleDateString("pt-BR") });
      saveState();
      openDetails(movieId);
      showToast("Avaliação registrada!");
    }

    /* Checkout Pix CPF 05850466622 + Liberação Instantânea */
    function openCheckout(movieId) {
      const m = state.movies.find(item => item.id === movieId);
      if (!m) return;
      state.currentCheckoutMovieId = m.id;

      const amount = Number(m.price || DEFAULT_PRICE);
      const pixPayload = buildPixPayload(amount, m.id);

      document.getElementById("checkoutBody").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <div>
            <div style="font-size:0.8rem; color:var(--muted);">Filme selecionado</div>
            <div style="font-size:1.1rem; font-weight:800;">${escapeHtml(m.title)}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.8rem; color:var(--muted);">Valor</div>
            <div style="font-size:1.25rem; font-weight:800; color:var(--cyan);">${formatBRL(amount)}</div>
          </div>
        </div>

        <div class="pix-box">
          <div style="font-size:0.85rem; font-weight:700; color:var(--cyan); margin-bottom:4px;">
            Pix CPF: ${PIX_KEY_FORMATTED} (${PIX_KEY_RAW})
          </div>
          <div style="font-size:0.78rem; color:var(--muted); margin-bottom:10px;">
            Escaneie o QR Code ou copie o código Pix Copia e Cola e clique em liberar para abrir o vídeo na hora.
          </div>

          <canvas id="pixQrCanvas" width="184" height="184" style="border-radius:10px; background:#fff;"></canvas>

          <div class="pix-code-box" id="pixCopiaColaText">${escapeHtml(pixPayload)}</div>

          <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px;">
            <button type="button" class="btn btn-ghost btn-sm" onclick="copyPixCode()">Copiar Pix Copia e Cola</button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="copyRawPixKey()">Copiar Chave CPF ${PIX_KEY_RAW}</button>
          </div>

          <button type="button" class="btn btn-green" style="width:100%; padding:12px;" onclick="confirmPixAndOpenPlayer('${m.id}')">
            ✓ Já paguei o Pix • Abrir Vídeo Instantâneo
          </button>
        </div>
      `;

      document.getElementById("checkoutModal").classList.add("open");
      const canvas = document.getElementById("pixQrCanvas");
      if (canvas) drawQrMatrixOnCanvas(canvas, pixPayload);
    }

    function copyPixCode() {
      const code = document.getElementById("pixCopiaColaText")?.textContent || "";
      navigator.clipboard?.writeText(code).then(
        () => showToast("Código Pix Copia e Cola copiado!"),
        () => showToast("Selecione e copie o código manualmente.")
      );
    }

    function copyRawPixKey() {
      navigator.clipboard?.writeText(PIX_KEY_RAW).then(
        () => showToast(`Chave Pix CPF ${PIX_KEY_RAW} copiada!`),
        () => showToast(`Chave Pix CPF: ${PIX_KEY_RAW}`)
      );
    }

    function confirmPixAndOpenPlayer(movieId) {
      const m = state.movies.find(item => item.id === movieId);
      if (!m) return;

      const amount = Number(m.price || DEFAULT_PRICE);
      if (!state.unlocked.includes(m.id)) {
        state.unlocked.push(m.id);
      }
      state.sales.push({
        id: `sale-${Date.now()}`,
        movieId: m.id,
        movieTitle: m.title,
        amount,
        pixKey: PIX_KEY_RAW,
        date: new Date().toLocaleString("pt-BR")
      });
      if (!state.progress[m.id]) state.progress[m.id] = 5;

      saveState();
      closeModal("checkoutModal");
      render();
      showToast(`Pix confirmado! Abrindo "${m.title}"...`);
      openPlayer(m.id);
    }

    /* Player Multi-formato */
    function parseEmbedUrl(url) {
      if (!url) return null;
      const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
      if (ytMatch) {
        return `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1`;
      }
      const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if (driveMatch) {
        return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      }
      return null;
    }

    function openPlayer(movieId) {
      const m = state.movies.find(item => item.id === movieId);
      if (!m) return;
      state.currentPlayerMovieId = m.id;
      document.getElementById("playerTitle").textContent = `▶ ${m.title}`;

      const embedUrl = parseEmbedUrl(m.videoUrl);
      const isDirectVideo = m.videoUrl && !embedUrl && /\.(mp4|webm|ogg)(\?.*)?$/i.test(m.videoUrl) || (m.videoUrl && !embedUrl && m.videoUrl.startsWith("http"));

      let mediaHtml = "";
      if (embedUrl) {
        mediaHtml = `<iframe src="${escapeHtml(embedUrl)}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
      } else if (isDirectVideo) {
        mediaHtml = `
          <video id="mainVideoEl" controls autoplay playsinline src="${escapeHtml(m.videoUrl)}" ontimeupdate="trackVideoProgress('${m.id}', this)"></video>
        `;
      } else {
        mediaHtml = `
          <div class="demo-screen">
            <div style="font-size:0.8rem; color:var(--cyan); font-weight:700; margin-bottom:6px;">EXIBIÇÃO LIBERADA VIA PIX CPF ${PIX_KEY_FORMATTED}</div>
            <h2 style="font-size:1.5rem; margin-bottom:8px;">${escapeHtml(m.title)}</h2>
            <p style="color:var(--muted); max-width:460px; font-size:0.9rem;">
              Este filme está desbloqueado para você. Para reproduzir um vídeo externo específico, cole o link do YouTube, Google Drive ou .mp4 no campo de URL do filme no Painel Admin.
            </p>
          </div>
        `;
      }

      const whatsappText = encodeURIComponent(
        `Olá! Confirmei o pagamento Pix (CPF ${PIX_KEY_FORMATTED}) de ${formatBRL(m.price || DEFAULT_PRICE)} e liberei o filme "${m.title}" no CinePay.`
      );

      document.getElementById("playerBody").innerHTML = `
        <div class="player-frame">${mediaHtml}</div>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px;">
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <span style="font-size:0.8rem; color:var(--muted);">Velocidade:</span>
            ${[0.75, 1, 1.25, 1.5, 2].map(spd => `<button class="btn btn-ghost btn-sm" onclick="setVideoSpeed(${spd})">${spd}x</button>`).join("")}
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-ghost btn-sm" onclick="markWatched('${m.id}')">Marcar como concluído</button>
            <a class="btn btn-green btn-sm" style="text-decoration:none;" target="_blank" rel="noopener" href="https://wa.me/?text=${whatsappText}">
              Enviar comprovante no WhatsApp
            </a>
          </div>
        </div>
      `;

      document.getElementById("playerModal").classList.add("open");
    }

    function setVideoSpeed(speed) {
      const vid = document.getElementById("mainVideoEl");
      if (vid) {
        vid.playbackRate = speed;
        showToast(`Velocidade: ${speed}x`);
      } else {
        showToast(`Velocidade selecionada: ${speed}x`);
      }
    }

    function trackVideoProgress(movieId, vid) {
      if (!vid.duration) return;
      const pct = Math.round((vid.currentTime / vid.duration) * 100);
      if (pct > (state.progress[movieId] || 0)) {
        state.progress[movieId] = pct;
        saveState();
      }
    }

    function markWatched(movieId) {
      state.progress[movieId] = 100;
      saveState();
      render();
      showToast("Filme marcado como concluído!");
    }

    function closePlayer() {
      const vid = document.getElementById("mainVideoEl");
      if (vid) vid.pause();
      document.getElementById("playerBody").innerHTML = "";
      closeModal("playerModal");
      render();
    }

    function closeModal(id) {
      document.getElementById(id)?.classList.remove("open");
    }

    function syncNetStatus() {
      const badge = document.getElementById("netStatus");
      if (!badge) return;
      if (navigator.onLine) {
        badge.textContent = "Online";
        badge.classList.remove("offline");
      } else {
        badge.textContent = "Offline";
        badge.classList.add("offline");
      }
    }

    window.addEventListener("online", syncNetStatus);
    window.addEventListener("offline", syncNetStatus);

    loadState();
    syncNetStatus();
    render();
  </script>
</body>
</html>
